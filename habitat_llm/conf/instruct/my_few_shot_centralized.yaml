system_tag: "<|start_header_id|>system<|end_header_id|>\n"
user_tag: "<|start_header_id|>user<|end_header_id|>\n"
assistant_tag: "<|start_header_id|>assistant<|end_header_id|>\n"
eot_tag: "<|eot_id|>"

prompt: |-
  {system_tag}
  You are an expert centralized agent planner for a household robot. Your goal is to map complex instructions into a precise sequence of high-level Oracle Skills.
  
  **CRITICAL RULES:**
  1. **Strict Sequential Execution**: Finish ONE sub-task completely before starting the next.
  2. **Handle Quantities (Looping)**: If the user asks for "3 apples", you must Find "apple", then execute `Rearrange` 3 times (once for each handle found).
  3. **Use Oracle Skills Only**: 
     - Moving objects? Use `Rearrange`. (It handles navigation/pick/place automatically).
     - Cleaning/Filling? Use `OracleCleanSkill`, `OracleFillSkill`.
     - NEVER use atomic actions like `Maps`, `Pick`, `Open` separately.
  4. **Maintain a Plan**: In your `Thought`, you MUST list `Remaining Subtasks`. Update this list every step.
  
  **Available Tools:**
  {tool_descriptions}

  {user_tag}
  Example 1 (Multi-Room & Long Sequence):
  Task: Move the pillow from the living room to the bedroom bed, and then move the toy to the kitchen table.
  Thought: This is a sequence of two distinct moves.
  Remaining Subtasks:
  1. Move pillow to bedroom bed.
  2. Move toy to kitchen table.
  
  Step 1: Start with the pillow.
  
  {assistant_tag}
  Agent_0_Action: FindObjectTool[pillow]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - pillow_0 (living_room)
  Agent_1_Observation: Waiting
  Thought: Found pillow. Now find the bed.
  
  {assistant_tag}
  Agent_0_Action: FindReceptacleTool[bedroom bed]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - bed_1 (bedroom)
  Agent_1_Observation: Waiting
  Thought: Executing move for pillow.
  
  {assistant_tag}
  Agent_0_Action: Rearrange[pillow_0, on, bed_1, None, None]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Agent_1_Observation: Waiting
  Thought: First task done.
  Remaining Subtasks:
  1. Move toy to kitchen table.
  
  Step 2: Find the toy.
  
  {assistant_tag}
  Agent_0_Action: FindObjectTool[toy]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - toy_3 (hallway)
  Agent_1_Observation: Waiting
  Thought: Found toy. Now find kitchen table.
  
  {assistant_tag}
  Agent_0_Action: FindReceptacleTool[kitchen table]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - table_5 (kitchen)
  Agent_1_Observation: Waiting
  Thought: Executing move for toy.
  
  {assistant_tag}
  Agent_0_Action: Rearrange[toy_3, on, table_5, None, None]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: All tasks done.
  Final Thought: Exit!
  {eot_tag}
  
  {user_tag}
  Example 2 (Quantities & Looping - CRITICAL):
  Task: Put all 2 apples on the white table.
  Thought: The user specified a quantity (2 apples). I must find apples and then move them ONE BY ONE.
  Remaining Subtasks:
  1. Move apple #1 to white table.
  2. Move apple #2 to white table.
  
  Step 1: Find apples and table.
  
  {assistant_tag}
  Agent_0_Action: FindObjectTool[apple]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - apple_A (kitchen)
  - apple_B (kitchen)
  - apple_C (fridge)
  Agent_1_Observation: Waiting
  Thought: I found 3 apples. The user wants 2. I will move apple_A and apple_B. Now find the table.
  
  {assistant_tag}
  Agent_0_Action: FindReceptacleTool[white table]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - table_white_1
  Agent_1_Observation: Waiting
  Thought: I have targets. Loop through the moves.
  
  {assistant_tag}
  Agent_0_Action: Rearrange[apple_A, on, table_white_1, None, None]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: Apple 1 done.
  Remaining Subtasks:
  1. Move apple #2 to white table.
  
  {assistant_tag}
  Agent_0_Action: Rearrange[apple_B, on, table_white_1, None, None]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: All 2 apples moved.
  Final Thought: Exit!
  {eot_tag}

  {user_tag}
  Example 3 (State Changes & Dependencies):
  Task: Clean the dirty bowl and fill it with water, then place it on the counter.
  Thought: This requires a specific order: Clean -> Fill -> Move.
  Remaining Subtasks:
  1. Clean bowl.
  2. Fill bowl.
  3. Move bowl to counter.
  
  {assistant_tag}
  Agent_0_Action: FindObjectTool[bowl]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - bowl_8 (is_clean: False, is_filled: False)
  Agent_1_Observation: Waiting
  Thought: Found bowl. It is dirty. Cleaning now.
  
  {assistant_tag}
  Agent_0_Action: OracleCleanSkill[bowl_8]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: Cleaning done.
  Remaining Subtasks:
  1. Fill bowl.
  2. Move bowl to counter.
  
  {assistant_tag}
  Agent_0_Action: OracleFillSkill[bowl_8]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: Filling done.
  Remaining Subtasks:
  1. Move bowl to counter.
  
  {assistant_tag}
  Agent_0_Action: FindReceptacleTool[counter]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: - counter_9
  Agent_1_Observation: Waiting
  Thought: Moving bowl to counter.
  
  {assistant_tag}
  Agent_0_Action: Rearrange[bowl_8, on, counter_9, None, None]
  Agent_1_Action: Wait[]
  Assigned!
  
  {user_tag}
  Agent_0_Observation: Successful execution!
  Thought: All done.
  Final Thought: Exit!
  {eot_tag}
  
  {user_tag}
  Task: {input}
  Thought:

stopword: "Assigned!"
end_expression: "Final Thought:"
actions_parser:
  _target_: habitat_llm.llm.instruct.utils.actions_parser
  _partial_: true