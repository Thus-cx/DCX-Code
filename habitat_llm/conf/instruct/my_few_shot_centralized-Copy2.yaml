prompt: |-
        {system_tag}
        - Overview:
        Solve the given multi-agent planning problem as best as you can. The task assigned to you will be situated in a house and will generally involve navigating to objects, picking and placing them on different receptacles to achieve rearrangement. Below is the detailed description of the actions you can use for solving the task. In these tasks, we assume the Agent_1 is in the stage of observing, which means Agent_1 is not available. You can assign the tasks only to Agent_0 as required, and Agent_1 keeps the Waiting state during all the tasks. For FindObjectTool or FindReceptacleTool, they can find one or more than one objects at the same time, but in the next actions, you should remember to process these objects one by one. Do not only process the first object in the find-object list.

        {tool_descriptions}

        Here are some examples:

        {user_tag}
        Example 1:
        Task: Move all objects from sofa to sink
        Thought: First I should ask Agent_0 to find the objects that are on the sofa.

        {assistant_tag}
        Agent_0_Action: FindObjectTool[Objects on the sofa]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: - cherry_0 in Sofa
        - banana_0 in Sofa
        Agent_1_Observation: Waiting
        Thought: Now I should ask Agent_0 to find the sink.

        {assistant_tag}
        Agent_0_Action: FindReceptacleTool[sink]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: sink_0
        Agent_1_Observation: Waiting
        Thought: Now that Agent 0 has found the task relevant objects and receptacles, I will come up with a task plan.

        {assistant_tag}
        Agent_0_Action: Rearrange[cherry_0, on, sink_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: Agent 0 successfully transferred the target. The banana is still on the sofa, so I will assign the next action to Agent 0.

        {assistant_tag}
        Agent_0_Action: Rearrange[banana_0, on, sink_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: All objects were successfully moved, so I am done!
        Final Thought: Exit!
        {eot_tag}

        {user_tag}
        Example 2:
        Task: Move pillow to bed and then move apple to kitchen counter
        Thought: There are two parts in the task. I will consider the two parts in order, I will think the part of "move pillow to bed" at first. Now I should ask Agent 0 to find the pillow.
        
        {assistant_tag}
        Agent_0_Action: FindObjectTool[pillow]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: -pillow_0 in sofa
        -pillow_1 in couch
        Agent_1_Observation: Waiting
        Thought: Now I should ask Agent_0 to find the bed.

        {assistant_tag}
        Agent_0_Action: FindReceptacleTool[bed]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: bed_0, bed_1
        Agent_1_Observation: Waiting
        Thought: Now that Agent 0 has found the first part revelant objects and receptacles, I will come up with a task plan. Since there are many beds, I will pick any one of them.

        {assistant_tag}
        Agent_0_Action: Rearrange[pillow_0, on, bed_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: In the first part of the whole task, the pillow_1 is still on the couch. Now I should ask Agent 0 to transfer the pillow_1.

        {assistant_tag}
        Agent_0_Action: Rearrange[pillow_1, on, bed_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: Now that both pillows have been successfully moved, I will move on to the next part of the task. I should ask Agent 0 to find the apple first.

        {assistant_tag}
        Agent_0_Action: FindObjectTool[apple]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: - apple_0 in sofa
        Agent_1_Observation: Waiting
        Thought: Now I should ask Agent 0 to find the kitchen counter.

        {assistant_tag}
        Agent_0_Action: FindReceptacleTool[kitchen counter]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: counter_0, count_1, count_2 are in kitchen
        Agent_1_Observation: Waiting
        Thought: Now that Agent 0 has found the second part of the task relevant objects and receptacles, I will come up with a task plan. Since there are multiple counters in kitchen, I will pick any one of them.

        {assistant_tag}
        Agent_0_Action: Rearrange[apple_0, on, counter_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: All objects were successfully moved, so I am done!
        Final Thought: Exit!
        {eot_tag}

        {user_tag}
        Example 3:
        Task: Move bowl, cup and basket to the chair in living room
        Thought: First I should ask Agent 0 to find bowl, cup and basket.

        {assistant_tag}
        Agent_0_Action: FindObjectTool[bowl, cup, basket]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: - bowl_0 in Sofa
        - cup_1 in Sofa
        - basket_2 in Sofa
        Agent_1_Observation: Waiting
        Thought: Now I should ask Agent 0 to find the chair in living room.

        {assistant_tag}
        Agent_0_Action: FindReceptacleTool[chair in living room]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: chair_0, chair_1, chair_2, chair_3 found in living room.
        Agent_1_Observation: Waiting
        Thought: Now that Agent 0 has found the task revelant objects and receptacles, I will come up with a task plan. Since there are many chairs, I will pick any one of them.

        {assistant_tag}
        Agent_0_Action: Rearrange[bowl_0, on, chair_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: Agent 0 successfully transferred the target. So I will assign the next action to it.

        {assistant_tag}
        Agent_0_Action: Rearrange[cup_1, on, chair_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: Agent 0 successfully transferred the target. The basket is still in the sofa. So I will assign the next action to it.

        {assistant_tag}
        Agent_0_Action: Rearrange[basket_2, on, chair_0, None, None]
        Agent_1_Action: Wait[]
        Assigned!

        {user_tag}
        Agent_0_Observation: Successful execution!
        Agent_1_Observation: Waiting
        Thought: All objects were successfully moved, so I am done!
        Final Thought: Exit!
        {eot_tag}

        {user_tag}
        Task: {input}
        Thought:

# This is crucial, it's when the LLM stops generating text and waits for the
# environment to respond
stopword       : "Assigned!"

# End of the interaction.
end_expression : "Final Thought:"

# The parser is a function that maps LLM output to a tuple of (agent, action, action_input)
actions_parser:
  _target_     : habitat_llm.llm.instruct.utils.actions_parser

  # It's a function so we do partial initialization
  _partial_    : true