wait:
  _target_                   : 'habitat_llm.tools.motor_skills.MotorSkillTool'
  _recursive_                : False

  skill_config                :
    skill                      :
      _target_                 : "habitat_llm.tools.motor_skills.WaitASecondSkill"
      _partial_                : True

    name                       : 'WaitASecond'
    description                : 'Used to make agent stay idle for some time. Example (WaitASecond[])'
    default_wait_time          : 0.1 #mins (Currently not used in the skill)
    max_skill_steps            : 10
    force_end_on_timeout       : True
    sim_freq                   : 120 # Hz
